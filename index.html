<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>혜움 - 건국대학교 수의학과 편집부</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --background: #f7f3ef; /* 연한 베이지 */
            --surface-card: #fff;
            --border-color: #c4a882; /* 밝은 갈색 */
            --foreground: #4a3a2a; /* 짙은 갈색 텍스트 */
            --accent-primary: #9b6b43; /* 강조색 */
        }
        body {
            font-family: 'DM Sans', 'Inter', sans-serif;
            background-color: var(--background);
            color: var(--foreground);
            min-height: 100vh;
        }
        .catalog-card {
            border: 2px solid var(--border-color);
            box-shadow: 4px 4px 0px 0px rgba(122, 92, 61, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .catalog-card:hover {
            transform: translateY(-2px);
            box-shadow: 6px 6px 0px 0px rgba(122, 92, 61, 0.3);
        }
    </style>
</head>
<body class="p-4 sm:p-8">

    <!-- 헤더 섹션 -->
    <header class="max-w-4xl mx-auto mb-10">
        <div class="flex items-center justify-between border-b-2 border-amber-800/50 pb-4">
            <!-- 로고 및 제목 -->
            <div class="flex items-center space-x-4">
                 <!-- 펜과 책 SVG 아이콘 -->
                <svg class="w-10 h-10 text-amber-800" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4m8-4l4 4-4 4m-4-4l-4 4 4 4"></path>
                </svg>
                <h1 class="text-3xl font-bold text-amber-800">혜움 - 건국대학교 수의학과 편집부</h1>
            </div>
            <!-- 홈 버튼 -->
            <a href="/" class="text-sm text-amber-800 hover:text-amber-900 transition font-medium border-2 border-amber-800 px-3 py-1 rounded-full">홈으로</a>
        </div>
        
        <!-- 배너/설명 문구 -->
        <p id="description-banner" class="mt-8 text-center text-xl text-amber-900/80 font-medium p-4 bg-white/50 rounded-lg shadow-sm">
            매년 발행되는 교지와 월간지의 디지털 아카이브입니다.
        </p>
    </header>

    <!-- 카탈로그 목록 섹션 -->
    <main class="max-w-4xl mx-auto">
        <h2 class="text-2xl font-semibold text-amber-900 mb-6 border-b pb-2">모든 카탈로그</h2>
        
        <!-- 카탈로그 목록 표시될 컨테이너 -->
        <div id="catalog-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <p id="loading-message" class="text-lg text-gray-500 col-span-full">브로슈어를 불러오는 중...</p>
        </div>
        
        <p id="error-message" class="hidden text-center text-red-600 mt-8"></p>
    </main>

    <!-- 자바스크립트 로직 -->
    <script>
        // 💡 중요: Vercel에 배포된 API 서버의 주소를 여기에 입력해야 합니다.
        const API_URL = 'https://hyeyum-api.vercel.app/api/magazines'; 

        const catalogList = document.getElementById('catalog-list');
        const loadingMessage = document.getElementById('loading-message');
        const errorMessage = document.getElementById('error-message');

        /**
         * API 서버에서 교지 목록을 가져와 HTML로 렌더링합니다.
         */
        async function fetchCatalogs() {
            loadingMessage.classList.remove('hidden');
            errorMessage.classList.add('hidden');
            
            try {
                // 1. API 호출
                const response = await fetch(API_URL);
                if (!response.ok) {
                    throw new Error(`HTTP 오류! 상태 코드: ${response.status}`);
                }
                const catalogs = await response.json();

                // 2. 로딩 메시지 제거
                loadingMessage.classList.add('hidden');
                
                if (catalogs.length === 0) {
                    catalogList.innerHTML = '<p class="col-span-full text-center text-lg text-amber-800/70">게시된 교지가 아직 없습니다.</p>';
                    return;
                }

                // 3. 카탈로그 목록 렌더링
                catalogList.innerHTML = ''; // 기존 내용 초기화
                
                catalogs.forEach(catalog => {
                    const date = new Date(catalog.date).toLocaleDateString('ko-KR', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });

                    // 카탈로그 카드를 클릭하면 새 탭에서 구글 드라이브 미리보기를 엽니다.
                    const card = document.createElement('a');
                    card.href = catalog.url; // 구글 드라이브 미리보기 URL
                    card.target = '_blank'; // 새 탭에서 열기 (가장 안정적)
                    card.className = 'block p-4 bg-white rounded-xl catalog-card cursor-pointer';

                    card.innerHTML = `
                        <div class="text-xl font-bold text-amber-800 mb-2 truncate">${catalog.title}</div>
                        <div class="text-sm text-gray-500 mb-4">발행일: ${date}</div>
                        
                        <!-- 미리보기 이미지 (더미 이미지 사용) -->
                        <div class="bg-gray-100 h-40 flex items-center justify-center rounded-lg border border-gray-300 overflow-hidden">
                            <img src="https://placehold.co/150x200/9b6b43/ffffff?text=${encodeURIComponent(catalog.title).substring(0, 10)}" 
                                 onerror="this.src='https://placehold.co/150x200/9b6b43/ffffff?text=PDF'"
                                 alt="${catalog.title} 표지" 
                                 class="w-full h-full object-cover p-2">
                        </div>
                        
                        <div class="mt-4 text-center text-sm text-amber-700 font-semibold hover:underline">
                            클릭하여 보기 (새 창 열림)
                        </div>
                    `;
                    catalogList.appendChild(card);
                });

            } catch (error) {
                console.error("카탈로그 데이터를 가져오는 중 오류 발생:", error);
                loadingMessage.classList.add('hidden');
                errorMessage.classList.remove('hidden');
                errorMessage.textContent = '데이터를 불러오는 데 실패했습니다. (API 서버와의 연결 실패)';
            }
        }

        // 페이지 로드 시 함수 실행
        document.addEventListener('DOMContentLoaded', fetchCatalogs);
    </script>
</body>
</html>
<CODE_END>
